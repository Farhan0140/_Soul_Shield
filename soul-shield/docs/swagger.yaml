basePath: /
definitions:
  admin.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  admin.StatsResponse:
    properties:
      active_today:
        type: integer
      active_users:
        type: integer
      days:
        type: integer
      from:
        type: string
      new_users:
        type: integer
      tasks:
        items:
          $ref: '#/definitions/admin.TaskUsageResponse'
        type: array
      to:
        type: string
      total_users:
        type: integer
    type: object
  admin.TaskUsageResponse:
    properties:
      added_by:
        type: integer
      completion_rate:
        type: integer
      completions:
        type: integer
      opportunities:
        description: Opportunities = scheduled days in the window x active users.
        type: integer
      task_id:
        description: TaskID is the task's uuid (the same task_id the task list endpoints
          return).
        type: string
      title:
        type: string
      users:
        type: integer
    type: object
  category.CategoryResponse:
    properties:
      color_hex:
        type: string
      id:
        type: integer
      name:
        type: string
      position:
        type: integer
      uuid:
        description: |-
          UUID backs the mobile app's local-first store (see repo/sync.go) - kept
          alongside the numeric ID above, not in place of it, since the web
          client (soul-shield-client) still reads id as a number.
        type: string
    type: object
  category.CreateCategoryRequest:
    properties:
      color_hex:
        example: '#4F46E5'
        type: string
      name:
        example: Ibadah
        type: string
    type: object
  category.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  category.ReorderCategoriesRequest:
    properties:
      ordered_ids:
        items:
          type: integer
        type: array
    type: object
  category.SuccessResponse:
    properties:
      message:
        example: Category deleted successfully
        type: string
    type: object
  category.UpdateCategoryRequest:
    properties:
      color_hex:
        type: string
      name:
        type: string
    type: object
  repo.SyncCategory:
    properties:
      color_hex:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      name:
        type: string
      position:
        type: integer
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  repo.SyncChangeResult:
    properties:
      error:
        type: string
      resource:
        type: string
      server_row: {}
      status:
        description: |-
          Status: "accepted" (applied as sent), "superseded" (a newer
          server-side updated_at won - ServerRow carries the authoritative
          version so the caller can reconcile/log it), or "rejected" (validation
          or ownership failure for this one change specifically - Error
          explains why; unlike a Go error return from PushChanges, this does
          NOT abort the rest of the batch).
        type: string
      uuid:
        type: string
    type: object
  repo.SyncSnapshot:
    properties:
      categories:
        items:
          $ref: '#/definitions/repo.SyncCategory'
        type: array
      cursor:
        description: |-
          Cursor is the server's own clock at the moment the pull started
          (captured via `SELECT now()`, not derived from the returned rows'
          max updated_at) - passing it back as the next `since` means a row
          updated concurrently with this exact request is simply picked up on
          the *next* pull instead of possibly being missed, and (since nothing
          here is paginated - this app's per-user row counts are small enough
          to return in one response) there's no page-boundary tie to worry
          about either.
        type: string
      sub_task_completions:
        items:
          $ref: '#/definitions/repo.SyncSubTaskCompletion'
        type: array
      sub_tasks:
        items:
          $ref: '#/definitions/repo.SyncSubTask'
        type: array
      task_completions:
        items:
          $ref: '#/definitions/repo.SyncTaskCompletion'
        type: array
      tasks:
        items:
          $ref: '#/definitions/repo.SyncTask'
        type: array
    type: object
  repo.SyncSubTask:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      duration_seconds:
        type: integer
      parent_task_uuid:
        type: string
      position:
        type: integer
      target_count:
        type: integer
      task_type:
        type: string
      title:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  repo.SyncSubTaskCompletion:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      parent_task_uuid:
        type: string
      progress_count:
        type: integer
      status:
        type: string
      sub_task_uuid:
        type: string
      task_date:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  repo.SyncTask:
    properties:
      category_uuid:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      duration_seconds:
        type: integer
      is_active:
        type: boolean
      is_global:
        type: boolean
      position:
        type: integer
      recurrence_days:
        items:
          type: integer
        type: array
      recurrence_type:
        type: string
      reminder_time:
        type: string
      reward_text:
        type: string
      source_task_uuid:
        type: string
      target_count:
        type: integer
      task_type:
        type: string
      title:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  repo.SyncTaskCompletion:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      progress_count:
        type: integer
      status:
        type: string
      task_date:
        type: string
      task_uuid:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  sync.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  sync.PushRequest:
    type: object
  sync.PushResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/repo.SyncChangeResult'
        type: array
    type: object
  task.AddToMyTasksResponse:
    properties:
      already_added:
        description: |-
          AlreadyAdded true হলে বোঝাবে নতুন কোনো task তৈরি হয়নি - user এর আগে থেকেই এই
          fixed task টার একটা personal copy আছে (lineage বা case-insensitive title ম্যাচে)
        example: false
        type: boolean
      category_id:
        example: 3
        type: integer
      category_name:
        example: Fitness
        type: string
      category_uuid:
        type: string
      task_id:
        example: 12
        type: integer
      task_uuid:
        type: string
    type: object
  task.CompleteTaskRequest:
    properties:
      date:
        description: 'না দিলে আজকের তারিখ ধরা হবে; format: YYYY-MM-DD'
        example: "2026-07-04"
        type: string
    type: object
  task.CompletionResponse:
    properties:
      completed_at:
        type: string
      date:
        example: "2026-07-04"
        type: string
      id:
        example: 10
        type: integer
      reward_text:
        example: Alhamdulillah! +1 for jannah
        type: string
      status:
        example: completed
        type: string
      task_id:
        example: 1
        type: integer
      task_title:
        example: Read Quran
        type: string
    type: object
  task.CreateTaskRequest:
    properties:
      category_id:
        example: 1
        type: integer
      description:
        example: Read at least 1 page daily
        type: string
      duration_seconds:
        description: task_type=timer হলে required
        example: 1500
        type: integer
      is_global:
        example: false
        type: boolean
      recurrence_days:
        example:
        - 1
        - 3
        - 5
        items:
          type: integer
        type: array
      recurrence_type:
        enum:
        - daily
        - weekly
        - custom
        example: custom
        type: string
      reminder_time:
        description: optional, "HH:MM" 24-hour format
        example: "18:30"
        type: string
      reward_text:
        example: Alhamdulillah! +1 for jannah
        type: string
      sub_tasks:
        description: |-
          SubTasks দিলে parent task এর status এখন থেকে sub-task completion থেকে derive হবে
          (pending/partially_completed/completed) - parent নিজে সরাসরি complete করা যাবে না।
        items:
          $ref: '#/definitions/task.SubTaskInput'
        type: array
      target_count:
        description: task_type=counter হলে required
        example: 100
        type: integer
      task_type:
        enum:
        - normal
        - counter
        - timer
        example: normal
        type: string
      title:
        example: Read Quran
        type: string
    type: object
  task.ErrorResponse:
    properties:
      error:
        example: invalid request
        type: string
    type: object
  task.IncrementTaskRequest:
    properties:
      amount:
        description: batch amount, single-tap না
        example: 10
        type: integer
      date:
        example: "2026-07-04"
        type: string
    type: object
  task.ManageableTaskResponse:
    properties:
      category_id:
        type: integer
      category_uuid:
        type: string
      id:
        type: integer
      position:
        type: integer
      sub_tasks:
        items:
          $ref: '#/definitions/task.SubTaskStatusResponse'
        type: array
      title:
        type: string
      uuid:
        type: string
    type: object
  task.PaginatedTasksResponse:
    properties:
      completed_items:
        example: 5
        type: integer
      page:
        example: 1
        type: integer
      page_size:
        example: 10
        type: integer
      tasks:
        items:
          $ref: '#/definitions/task.TaskWithStatusResponse'
        type: array
      total_items:
        example: 23
        type: integer
      total_pages:
        example: 3
        type: integer
    type: object
  task.PersonalStatsResponse:
    properties:
      best_weekday:
        description: 'BestWeekday: 0 = Sunday ... 6 = Saturday; omitted with no completions.'
        example: 5
        type: integer
      completion_rate:
        example: 75
        type: integer
      days:
        example: 365
        type: integer
      favorite_category:
        example: Prayer
        type: string
      favorite_category_count:
        example: 300
        type: integer
      streak:
        example: 12
        type: integer
      total_completed:
        example: 900
        type: integer
      total_tasks:
        example: 1200
        type: integer
    type: object
  task.ReorderTasksRequest:
    properties:
      category_id:
        type: integer
      ordered_ids:
        items:
          type: integer
        type: array
    type: object
  task.SubTaskCompletionResponse:
    properties:
      completed_at:
        type: string
      date:
        example: "2026-07-04"
        type: string
      id:
        example: 10
        type: integer
      parent_reward_text:
        type: string
      parent_status:
        example: partially_completed
        type: string
      parent_task_id:
        example: 1
        type: integer
      progress_count:
        type: integer
      status:
        example: completed
        type: string
      sub_task_id:
        example: 5
        type: integer
      sub_task_title:
        example: Read 1 page
        type: string
    type: object
  task.SubTaskInput:
    properties:
      description:
        description: optional
        example: Read the page slowly, focusing on meaning
        type: string
      duration_seconds:
        description: task_type=timer হলে required
        example: 600
        type: integer
      id:
        description: update এ existing sub-task ম্যাচ করাতে; create এ omit করবেন
        example: 5
        type: integer
      target_count:
        description: task_type=counter হলে required
        example: 10
        type: integer
      task_type:
        enum:
        - normal
        - counter
        - timer
        example: normal
        type: string
      title:
        example: Read 1 page
        type: string
    type: object
  task.SubTaskStatusResponse:
    properties:
      completed_at:
        type: string
      description:
        example: Read the page slowly, focusing on meaning
        type: string
      duration_seconds:
        example: 600
        type: integer
      progress_count:
        type: integer
      status:
        example: pending
        type: string
      sub_task_id:
        example: 5
        type: integer
      sub_task_uuid:
        description: |-
          SubTaskUUID backs the mobile app's local-first store (see repo/sync.go)
          - kept alongside the numeric SubTaskID above, not in place of it, since
          the web client (soul-shield-client) still reads this same field as a
          number.
        type: string
      target_count:
        example: 10
        type: integer
      task_type:
        example: normal
        type: string
      title:
        example: Read 1 page
        type: string
    type: object
  task.SuccessResponse:
    properties:
      message:
        example: Task created successfully
        type: string
    type: object
  task.TaskResponse:
    properties:
      created_at:
        type: string
      created_by:
        example: 1
        type: integer
      description:
        example: Read at least 1 page daily
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      is_global:
        example: false
        type: boolean
      owner_id:
        example: 3
        type: integer
      position:
        type: integer
      recurrence_days:
        example:
        - 1
        - 3
        - 5
        items:
          type: integer
        type: array
      recurrence_type:
        example: custom
        type: string
      sub_tasks:
        items:
          $ref: '#/definitions/task.SubTaskStatusResponse'
        type: array
      title:
        example: Read Quran
        type: string
      updated_at:
        type: string
    type: object
  task.TaskWithStatusResponse:
    properties:
      already_added:
        description: |-
          AlreadyAdded - is_global task এর জন্য, বর্তমান ইউজার আগেই এই fixed task টা
          নিজের task লিস্টে "Add to Your Own Tasks" দিয়ে যুক্ত করেছে কিনা (personal task এর জন্য সবসময় false)
        type: boolean
      category_color:
        type: string
      category_id:
        type: integer
      category_name:
        type: string
      category_uuid:
        type: string
      completed_at:
        type: string
      date:
        type: string
      description:
        type: string
      duration_seconds:
        type: integer
      is_global:
        type: boolean
      position:
        type: integer
      progress_count:
        type: integer
      recurrence_days:
        items:
          type: integer
        type: array
      recurrence_type:
        type: string
      reminder_time:
        type: string
      reward_text:
        type: string
      status:
        type: string
      sub_tasks:
        items:
          $ref: '#/definitions/task.SubTaskStatusResponse'
        type: array
      target_count:
        type: integer
      task_id:
        type: integer
      task_type:
        type: string
      task_uuid:
        description: |-
          TaskUUID backs the mobile app's local-first store (see repo/sync.go) -
          kept alongside the numeric TaskID above, not in place of it, since the
          web client (soul-shield-client) still reads task_id as a number.
        type: string
      title:
        type: string
    type: object
  task.UpdateTaskRequest:
    properties:
      category_id:
        description: 0 পাঠালে uncategorize হবে
        type: integer
      description:
        type: string
      duration_seconds:
        type: integer
      is_active:
        type: boolean
      recurrence_days:
        items:
          type: integer
        type: array
      recurrence_type:
        enum:
        - daily
        - weekly
        - custom
        type: string
      reminder_time:
        description: '"HH:MM" 24-hour format, empty string clears it'
        type: string
      reward_text:
        type: string
      sub_tasks:
        description: |-
          SubTasks nil হলে touch করা হবে না; দিলে (even []) পুরো লিস্ট replace হবে -
          existing id ম্যাচ করলে update, নতুন id ছাড়া entry হলে insert, বাদ পড়া entry delete।
        items:
          $ref: '#/definitions/task.SubTaskInput'
        type: array
      target_count:
        type: integer
      title:
        type: string
    type: object
  user.ChangePasswordRequest:
    properties:
      current_password:
        example: OldPassword@123
        type: string
      new_password:
        example: NewPassword@123
        type: string
    type: object
  user.ChangePasswordResponse:
    properties:
      message:
        type: string
      token:
        type: string
    type: object
  user.DeleteAccountRequest:
    properties:
      password:
        example: Password@123
        type: string
    type: object
  user.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  user.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  user.PushTokenRequest:
    properties:
      platform:
        description: ios | android | unknown
        example: android
        type: string
      token:
        description: |-
          The Expo push token (ExponentPushToken[...]) obtained on-device via
          getExpoPushTokenAsync. Unique per device; re-registering updates the
          row's user/platform.
        example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
        type: string
    type: object
  user.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      security_answer:
        example: Bluebird
        type: string
    type: object
  user.RegisterResponse:
    properties:
      email:
        example: user@gmail.com
        type: string
      full_name:
        example: Farhan
        type: string
      id:
        example: 1
        type: integer
    type: object
  user.ResetPasswordRequest:
    properties:
      new_password:
        example: Password@123
        type: string
      reset_token:
        type: string
    type: object
  user.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  user.VerifySecurityAnswerRequest:
    properties:
      email:
        example: user@gmail.com
        type: string
      security_answer:
        example: Bluebird
        type: string
    type: object
  user.VerifySecurityAnswerResponse:
    properties:
      message:
        type: string
      reset_token:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: farhannadim0000@gmail.com
    name: Farhan
  description: Your Daily Steps Towards Jannah
  termsOfService: http://swagger.io/terms/
  title: Soul Shield
  version: "1.0"
paths:
  /admin/stats:
    get:
      description: |-
        Real usage numbers across ALL users for the last `days` days (default 30, max 366):
        user counts, daily/period active users, and per fixed task: completions, distinct users,
        how many users added it to their own tasks, and a completion rate
        (completions / (scheduled days x active users)). Admins only.
      parameters:
      - description: Window size in days (1-366), default 30
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.StatsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Admin usage statistics
      tags:
      - Admin
  /categories:
    get:
      description: লগইন করা user এর তৈরি করা সব category লিস্ট করে
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/category.CategoryResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/category.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Category info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/category.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/category.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - Categories
  /categories/{categoryId}/tasks:
    get:
      description: date না দিলে আজকের তারিখ ধরা হবে। page (default 1) আর page_size
        (default 10, max 100) দিয়ে pagination হয়।
      parameters:
      - description: Category ID
        in: path
        name: categoryId
        required: true
        type: integer
      - description: 'YYYY-MM-DD, default: today'
        in: query
        name: date
        type: string
      - description: 'default: 1'
        in: query
        name: page
        type: integer
      - description: 'default: 10'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.PaginatedTasksResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List a category's tasks for a date, paginated
      tags:
      - Tasks
  /categories/{id}:
    delete:
      description: Delete করলে যেসব task এই category ব্যবহার করছিল সেগুলো uncategorized
        হয়ে যাবে (task মুছে যাবে না)
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/category.SuccessResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/category.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/category.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete category
      tags:
      - Categories
    patch:
      consumes:
      - application/json
      description: শুধু category এর owner ই আপডেট করতে পারবে
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/category.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/category.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/category.ErrorResponse'
        "404":
          description: Not Found
          schema:
