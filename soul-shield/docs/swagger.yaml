      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/task.TaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create task
      tags:
      - Tasks
