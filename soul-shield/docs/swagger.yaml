basePath: /
definitions:
  category.CategoryResponse:
    properties:
      color_hex:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  category.CreateCategoryRequest:
    properties:
      color_hex:
        example: '#4F46E5'
        type: string
      name:
        example: Ibadah
        type: string
    type: object
  category.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  category.SuccessResponse:
    properties:
      message:
        example: Category deleted successfully
        type: string
    type: object
  category.UpdateCategoryRequest:
    properties:
      color_hex:
        type: string
      name:
        type: string
    type: object
  otp.ErrorResponse:
    properties:
      error:
        example: invalid request
        type: string
    type: object
  otp.SendOTPRequest:
    properties:
      email:
        type: string
    type: object
  otp.SuccessResponse:
    properties:
      message:
        example: OTP sent successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  otp.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  task.CompleteTaskRequest:
    properties:
      date:
        description: 'না দিলে আজকের তারিখ ধরা হবে; format: YYYY-MM-DD'
        example: "2026-07-04"
        type: string
    type: object
  task.CompletionResponse:
    properties:
      completed_at:
        type: string
      date:
        example: "2026-07-04"
        type: string
      id:
        example: 10
        type: integer
      reward_text:
        example: Alhamdulillah! +1 for jannah
        type: string
      status:
        example: completed
        type: string
      task_id:
        example: 1
        type: integer
      task_title:
        example: Read Quran
        type: string
    type: object
  task.CreateTaskRequest:
    properties:
      category_id:
        example: 1
        type: integer
      description:
        example: Read at least 1 page daily
        type: string
      is_global:
        example: false
        type: boolean
      recurrence_days:
        example:
        - 1
        - 3
        - 5
        items:
          type: integer
        type: array
      recurrence_type:
        enum:
        - daily
        - weekly
        - custom
        example: custom
        type: string
      reminder_time:
        description: optional, "HH:MM" 24-hour format
        example: "18:30"
        type: string
      reward_text:
        example: Alhamdulillah! +1 for jannah
        type: string
      target_count:
        description: task_type=counter হলে required
        example: 100
        type: integer
      task_type:
        enum:
        - normal
        - counter
        example: normal
        type: string
      title:
        example: Read Quran
        type: string
    type: object
  task.ErrorResponse:
    properties:
      error:
        example: invalid request
        type: string
    type: object
  task.IncrementTaskRequest:
    properties:
      amount:
        description: batch amount, single-tap না
        example: 10
        type: integer
      date:
        example: "2026-07-04"
        type: string
    type: object
  task.SuccessResponse:
    properties:
      message:
        example: Task created successfully
        type: string
    type: object
  task.TaskResponse:
    properties:
      created_at:
        type: string
      created_by:
        example: 1
        type: integer
      description:
        example: Read at least 1 page daily
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      is_global:
        example: false
        type: boolean
      owner_id:
        example: 3
        type: integer
      recurrence_days:
        example:
        - 1
        - 3
        - 5
        items:
          type: integer
        type: array
      recurrence_type:
        example: custom
        type: string
      title:
        example: Read Quran
        type: string
      updated_at:
        type: string
    type: object
  task.TaskWithStatusResponse:
    properties:
      category_color:
        type: string
      category_id:
        type: integer
      category_name:
        type: string
      completed_at:
        type: string
      date:
        type: string
      description:
        type: string
      is_global:
        type: boolean
      progress_count:
        type: integer
      recurrence_days:
        items:
          type: integer
        type: array
      recurrence_type:
        type: string
      reminder_time:
        type: string
      reward_text:
        type: string
      status:
        type: string
      target_count:
        type: integer
      task_id:
        type: integer
      task_type:
        type: string
      title:
        type: string
    type: object
  task.UpdateTaskRequest:
    properties:
      category_id:
        description: 0 পাঠালে uncategorize হবে
        type: integer
      description:
        type: string
      is_active:
        type: boolean
      recurrence_days:
        items:
          type: integer
        type: array
      recurrence_type:
        enum:
        - daily
        - weekly
        - custom
        type: string
      reminder_time:
        description: '"HH:MM" 24-hour format, empty string clears it'
        type: string
      reward_text:
        type: string
      target_count:
        type: integer
      title:
        type: string
    type: object
  user.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  user.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  user.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      security_answer:
        example: Bluebird
        type: string
    type: object
  user.ResetPasswordRequest:
    properties:
      new_password:
        example: Password@123
        type: string
      reset_token:
        type: string
    type: object
  user.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  user.VerifySecurityAnswerRequest:
    properties:
      email:
        example: user@gmail.com
        type: string
      security_answer:
        example: Bluebird
        type: string
    type: object
  user.VerifySecurityAnswerResponse:
    properties:
      message:
        type: string
      reset_token:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: farhannadim0000@gmail.com
    name: Farhan
  description: Your Daily Steps Towards Jannah
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: Soul Shield
  version: "1.0"
paths:
  /categories:
    get:
      description: লগইন করা user এর তৈরি করা সব category লিস্ট করে
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/category.CategoryResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/category.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Category info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/category.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/category.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - Categories
  /categories/{id}:
    delete:
      description: Delete করলে যেসব task এই category ব্যবহার করছিল সেগুলো uncategorized
        হয়ে যাবে (task মুছে যাবে না)
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/category.SuccessResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/category.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/category.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete category
      tags:
      - Categories
    patch:
      consumes:
      - application/json
      description: শুধু category এর owner ই আপডেট করতে পারবে
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/category.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/category.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/category.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/category.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update category
      tags:
      - Categories
  /send-otp:
    post:
      consumes:
      - application/json
      description: Send verification OTP to user email address
      parameters:
      - description: Email Information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/otp.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/otp.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/otp.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/otp.ErrorResponse'
      summary: Send OTP
      tags:
      - OTP
  /tasks:
    get:
      description: date না দিলে আজকের তারিখ ধরা হবে। যেই দিনে recurrence_days ম্যাচ
        করবে সেই task গুলোই দেখাবে।
      parameters:
      - description: 'YYYY-MM-DD, default: today'
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task.TaskWithStatusResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List today's (or given date's) tasks
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      description: |-
        User বা Admin task তৈরি করতে পারবে। is_global=true শুধু admin ব্যবহার করতে পারবে।
        ▹ for recurrence_days: 0=Sunday ... 6=Saturday.
        ▹ recurrence_type: 'daily', 'weekly', 'custom'. 'daily' হলে সব দিন auto বসিয়ে দেওয়া হবে insert time এ
        ▹ category_id: এই field না দিলে global task হিসেবে create হবে, category_id রাখতে চাইলে category id must দিতে হবে
        ▹ task_type "normal" হলে target_count optional, আর "counter" হলে target_count must দিতে হবে
        ▹ "counter" type task for dhikr
      parameters:
      - description: Task Info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/task.TaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create task
      tags:
      - Tasks
  /tasks/{id}:
    delete:
      description: Hard delete করে, কিন্তু completion history অক্ষত থাকে (snapshot
        হিসেবে)
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.SuccessResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete task
      tags:
      - Tasks
    patch:
      consumes:
      - application/json
      description: Owner (personal task) অথবা Admin (global task) আপডেট করতে পারবে
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.TaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update task
      tags:
      - Tasks
  /tasks/{id}/complete:
    post:
      consumes:
      - application/json
      description: date না দিলে আজকের তারিখ ধরা হবে। ঐ তারিখে task টা scheduled না
        থাকলে error দিবে।
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional date
        in: body
        name: body
        schema:
          $ref: '#/definitions/task.CompleteTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.CompletionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark a task as completed for a given date
      tags:
      - Tasks
  /tasks/{id}/increment:
    post:
      consumes:
      - application/json
      description: জিকির/গণনা টাইপ task এর জন্য - amount ব্যাচ আকারে পাঠান, একটা একটা
        tap এ কল করবেন না
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Increment amount
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.IncrementTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.CompletionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Increment progress of a counter-type task
      tags:
      - Tasks
  /tasks/history:
    get:
      description: from/to না দিলে গত ৭ দিন default হিসেবে দেখাবে (আজসহ)
      parameters:
      - description: YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: YYYY-MM-DD
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task.TaskWithStatusResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get task history for a date range
      tags:
      - Tasks
  /users/login:
    post:
      consumes:
      - application/json
      description: Login using email and password
      parameters:
      - description: Login Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: Login User
      tags:
      - Auth
  /users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Current User
      tags:
      - Users
  /users/register:
    post:
      consumes:
      - application/json
      description: Register a new user
      parameters:
      - description: User Info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: Create user
      tags:
      - Users
  /users/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password using the reset_token issued by /users/verify-security-answer
      parameters:
      - description: Password Reset Information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: Reset Password
      tags:
      - Users
  /users/verify-security-answer:
    post:
      consumes:
      - application/json
      description: |-
        Step 1 of password reset: verify the security answer set at registration.
        On success, returns a short-lived reset_token to use with /users/reset-password.
      parameters:
      - description: Email + Security Answer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.VerifySecurityAnswerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.VerifySecurityAnswerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: Verify Security Answer
      tags:
      - Users
  /verify-otp:
    post:
      consumes:
      - application/json
      description: Verify user email using OTP code
      parameters:
      - description: OTP Verification Information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/otp.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/otp.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/otp.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/otp.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/otp.ErrorResponse'
      summary: Verify OTP
      tags:
      - OTP
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
