      description: |-
        একটা is_global fixed task থেকে বর্তমান ইউজারের জন্য একটা personal কপি তৈরি করে।
        ▹ category: admin task এর category name এর সাথে ম্যাচ করা (case-insensitive) user category থাকলে সেটা reuse করা হয়, না থাকলে নতুন category তৈরি হয়
        ▹ duplicate: user এর আগে থেকেই এই fixed task এর কপি থাকলে (lineage বা case-insensitive title ম্যাচে) নতুন কিছু তৈরি হয় না, already_added=true রিটার্ন হয়
