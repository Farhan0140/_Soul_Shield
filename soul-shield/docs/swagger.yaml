basePath: /
definitions:
  otp.ErrorResponse:
    properties:
      error:
        example: invalid request
        type: string
    type: object
  otp.SendOTPRequest:
    properties:
      email:
        type: string
    type: object
  otp.SuccessResponse:
    properties:
      message:
        example: OTP sent successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  otp.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  task.CompleteTaskRequest:
    properties:
      date:
        description: 'না দিলে আজকের তারিখ ধরা হবে; format: YYYY-MM-DD'
        example: "2026-07-04"
        type: string
    type: object
  task.CompletionResponse:
    properties:
      completed_at:
        type: string
      date:
        example: "2026-07-04"
        type: string
      id:
        example: 10
        type: integer
      status:
        example: completed
        type: string
      task_id:
        example: 1
        type: integer
      task_title:
        example: Read Quran
        type: string
    type: object
  task.CreateTaskRequest:
    properties:
      description:
        example: Read at least 1 page daily
        type: string
      is_global:
        description: IsGlobal শুধু admin ব্যবহার করবে, user request এ ignore করা হবে
          (handler এ role check হবে)
        example: false
        type: boolean
      recurrence_days:
        description: 0=Sunday...6=Saturday, daily/weekly হলে optional
        example:
        - 1
        - 3
        - 5
        items:
          type: integer
        type: array
      recurrence_type:
        description: daily | weekly | custom
        example: custom
        type: string
      title:
        example: Read Quran
        type: string
    type: object
  task.ErrorResponse:
    properties:
      error:
        example: invalid request
        type: string
    type: object
  task.SuccessResponse:
    properties:
      message:
        example: Task created successfully
        type: string
    type: object
  task.TaskResponse:
    properties:
      created_at:
        type: string
      created_by:
        example: 1
        type: integer
      description:
        example: Read at least 1 page daily
        type: string
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      is_global:
        example: false
        type: boolean
      owner_id:
        example: 3
        type: integer
      recurrence_days:
        example:
        - 1
        - 3
        - 5
        items:
          type: integer
        type: array
      recurrence_type:
        example: custom
        type: string
      title:
        example: Read Quran
        type: string
      updated_at:
        type: string
    type: object
  task.TaskWithStatusResponse:
    properties:
      completed_at:
        type: string
      date:
        example: "2026-07-04"
        type: string
      description:
        example: Read at least 1 page daily
        type: string
      is_global:
        example: false
        type: boolean
      recurrence_type:
        example: custom
        type: string
      status:
        description: pending | completed | missed
        example: pending
        type: string
      task_id:
        example: 1
        type: integer
      title:
        example: Read Quran
        type: string
    type: object
  task.UpdateTaskRequest:
    properties:
      description:
        example: Read at least 2 pages daily
        type: string
      is_active:
        example: true
        type: boolean
      recurrence_days:
        example:
        - 1
        - 3
        - 5
        items:
          type: integer
        type: array
      recurrence_type:
        example: custom
        type: string
      title:
        example: Read Quran
        type: string
    type: object
  user.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  user.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  user.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
    type: object
  user.ResetPasswordRequest:
    properties:
      email:
        example: user@gmail.com
        type: string
      new_password:
        example: Password@123
        type: string
    type: object
  user.SuccessResponse:
    properties:
      message:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: farhannadim0000@gmail.com
    name: Farhan
  description: Your Daily Steps Towards Jannah
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: Soul Shield
  version: "1.0"
paths:
  /send-otp:
    post:
      consumes:
      - application/json
      description: Send verification OTP to user email address
      parameters:
      - description: Email Information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/otp.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/otp.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/otp.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/otp.ErrorResponse'
      summary: Send OTP
      tags:
      - OTP
  /tasks:
    get:
      description: date না দিলে আজকের তারিখ ধরা হবে। যেই দিনে recurrence_days ম্যাচ
        করবে সেই task গুলোই দেখাবে।
      parameters:
      - description: 'YYYY-MM-DD, default: today'
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task.TaskWithStatusResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List today's (or given date's) tasks
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      description: User বা Admin task তৈরি করতে পারবে। is_global=true শুধু admin ব্যবহার
        করতে পারবে।
      parameters:
      - description: Task Info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/task.TaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create task
      tags:
      - Tasks
  /tasks/{id}:
    delete:
      description: Hard delete করে, কিন্তু completion history অক্ষত থাকে (snapshot
        হিসেবে)
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.SuccessResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete task
      tags:
      - Tasks
    patch:
      consumes:
      - application/json
      description: Owner (personal task) অথবা Admin (global task) আপডেট করতে পারবে
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.TaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update task
      tags:
      - Tasks
  /tasks/{id}/complete:
    post:
      consumes:
      - application/json
      description: date না দিলে আজকের তারিখ ধরা হবে। ঐ তারিখে task টা scheduled না
        থাকলে error দিবে।
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional date
        in: body
        name: body
        schema:
          $ref: '#/definitions/task.CompleteTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.CompletionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark a task as completed for a given date
      tags:
      - Tasks
  /tasks/history:
    get:
      description: from/to না দিলে গত ৭ দিন default হিসেবে দেখাবে (আজসহ)
      parameters:
      - description: YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: YYYY-MM-DD
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task.TaskWithStatusResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get task history for a date range
      tags:
      - Tasks
  /users/login:
    post:
      consumes:
      - application/json
      description: Login using email and password
      parameters:
      - description: Login Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: Login User
      tags:
      - Auth
  /users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Current User
      tags:
      - Users
  /users/register:
    post:
      consumes:
      - application/json
      description: Register a new user
      parameters:
      - description: User Info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: Create user
      tags:
      - Users
  /users/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password after successful OTP verification
      parameters:
      - description: Password Reset Information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: Reset Password
      tags:
      - Users
  /verify-otp:
    post:
      consumes:
      - application/json
      description: Verify user email using OTP code
      parameters:
      - description: OTP Verification Information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/otp.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/otp.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/otp.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/otp.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/otp.ErrorResponse'
      summary: Verify OTP
      tags:
      - OTP
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
