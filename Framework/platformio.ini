; Soul Shield ESP32-C3 counter button — PlatformIO project
; Flash with:  pio run -t upload   (from this Framework/ folder)
;" See Framework/README.md for wiring and behavior.

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The Arduino BLE library used here ships with the espressif32 platform —
; no extra lib_deps needed.
build_flags =
    -DCORE_DEBUG_LEVEL=1
