; Soul Shield — ESP32 Dev Module (classic ESP32/WROOM) counter button
; PlatformIO project — flash with:  pio run -t upload  (from this folder)
; See README.md for wiring and behavior.

[env:esp32dev]
platform = espressif32
board = esp32dev            ; generic "ESP32 Dev Module"
framework = arduino
monitor_speed = 115200
; The Arduino BLE library used here ships with the espressif32 platform —
; no extra lib_deps needed.
build_flags =
    -DCORE_DEBUG_LEVEL=1
