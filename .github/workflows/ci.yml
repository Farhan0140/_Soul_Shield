name: CI

# Runs on every push and pull request: compile/vet/test the Go API, type-check
# + lint + unit-test the mobile app, and lint + build the web client.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soul-shield
    # Throwaway database for the repo/ integration tests (integration_test.go
    # skips them when TEST_DATABASE_URL is unset, e.g. on a laptop).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: soulshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d soulshield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/soulshield_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: soul-shield/go.mod
          cache-dependency-path: soul-shield/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Includes the shared-fixture test for computeParentStatus
      # (shared-test-fixtures/parent-status.json), also run by the mobile job.
      - name: Test
        # -p 1: the database tests in different packages share one database.
        run: go test -p 1 ./...

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soul-shield-mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs the .ts imports in tests/ directly (type stripping).
          node-version: '22'
          cache: npm
          cache-dependency-path: soul-shield-mobile-app/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm test

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soul-shield-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: soul-shield-client/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
